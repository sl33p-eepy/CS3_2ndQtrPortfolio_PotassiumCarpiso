<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q4 Ist Graded - Movie Rating</title>

    <style>
        body{
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-image: url('../bg6.jpg');
            background-size:cover;
            background-repeat: no-repeat;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 0;
            scroll-behavior: smooth;
        }

        main{
            width: 600px;
            flex: 1;
            margin: 50px auto;
        }

        form{
            background: rgba(248, 241, 243, 0.599);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0px 3px 10px rgba(0,0,0,0.1);
        }

        fieldset{
            border: none;
        }

        legend{
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        label{
            display: block;
            margin-top: 10px;
            width: 475px;
        }

        input, select{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button{
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background-color: #598e9a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover{
            background-color: #f7a5cd;
        }

        .stars{
            margin-top: 5px;
        }

        .star{
            font-size: 22px;
            cursor: pointer;
            color: lightgray;
        }   
        
        .star.active{
            color: gold;
        }

        h2{
            margin-top: 20px;
        }

        .movie{
            background: #eeeeee;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border: 1px solid #ccc;
        }

        .list {
            background: rgba(248, 241, 243, 0.599);
            padding: 10px;
            border-radius: 8px;
        }

        .starRating{
            color: gold;
        }

        footer {
            text-align: center;
            margin-top: auto;
            font-size: 14px;
            color: #333;
            background-color:#f4ea9f ;
            width: 100%;
            padding: 10px 0;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <main>
        <form id="signupForm" method="post" onsubmit="return handleSubmit(event)" onreset="return confirmReset()">

            <fieldset>
                <legend>Add a Movie</legend>

                <label>
                    Title:
                    <input type="text" id="title" required onblur="checkEmpty(this)">
                </label>

                <label>
                    Year:
                    <input type="number" id="year" required>
                </label>

                <label>
                    Genre:
                    <select id="genre" required>
                        <option value="" disabled selected>Select Genre</option>
                        <option value="Romance">Romance</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Horror">Horror</option>
                        <option value="Action">Action</option>
                        <option value="Sci-fi">Sci-Fi</option>
                        <option value="Fantasy">Fantasy</option>
                    </select>
                </label>

                <label>Rating:</label>
                <div class="stars">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
            </fieldset>

            <button type="button" onclick="addMovie()">Add Movie</button>
        </form>

        <br>

        <div class="list">
        <h2>Movie List</h2>
        <div class="movieList"></div>
        </div>
    </main>

    <footer>
        <p>2025 Carpiso || Q4 First Graded</p>
    </footer>

    <script>
        let rating=0;

        const stars = document.querySelectorAll(".star");

        stars.forEach(star=>{
            star.addEventListener("click", function(){
                rating = this.dataset.value

                stars.forEach(s=>s.classList.remove("active"))

                for(let i = 0; i < rating; i++){
                    stars[i].classList.add("active")
                }
            })
        })

        function addMovie() {
            const title = document.getElementById("title").value
            const year = document.getElementById("year").value
            const genre = document.getElementById("genre").value

            let movies = JSON.parse(localStorage.getItem("movies")) || []
            
            let existing = movies.find(m => m.title.toLowerCase() === title.toLowerCase())

            if(existing) {
                existing.year = year
                existing.genre = genre

                existing.count += 1

                existing.rating = Math.round((existing.rating * (existing.count - 1) + Number(rating)) / existing.count)
            } else {
                const movie = {
                    title: title,
                    year: year,
                    genre: genre,
                    rating: rating,
                    count: 1
                }

                movies.push(movie)
            }

            localStorage.setItem("movies", JSON.stringify(movies))

            displayMovies()

            document.getElementById("signupForm").reset()
            rating = 0
            stars.forEach(s => s.classList.remove("active"))
        }

        function displayMovies() {
            const list = document.querySelector(".movieList")

            list.innerHTML = ""
            let movies = JSON.parse(localStorage.getItem("movies")) || []

            movies.forEach(movie=>{
                let stars = "★".repeat(movie.rating)

                let div = document.createElement("div")
                div.className = "movie"

                div.innerHTML = 
                `${movie.title} (${movie.year}) - ${movie.genre}, 
                Rating: <span class="starRating">${stars}</span>
                <button onclick="deleteMovie('${movie.title}')">Delete</button>`

                list.appendChild(div)
                })
        }

        function deleteMovie(index) {
            if (confirm("Delete this movie?")) {
                let movies = JSON.parse(localStorage.getItem("movies")) || []
                movies.splice(index, 1)
                localStorage.setItem("movies", JSON.stringify(movies))
                displayMovies()
            }
        }

        displayMovies()
    </script>
</body>
</html>
